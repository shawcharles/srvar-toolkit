name: Release package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, written as vX.Y.Z
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH only after reviewing this run's build evidence
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Validate and build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validated-ref.outputs.tag }}
      version: ${{ steps.validated-ref.outputs.version }}
      artifact-name: ${{ steps.validated-ref.outputs.artifact_name }}
    steps:
      - name: Validate event ref and release tag
        id: validated-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          TAG_RE = re.compile(r"\Av\d+\.\d+\.\d+\Z")
          event_name = os.environ["EVENT_NAME"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          dispatch_tag = os.environ["DISPATCH_TAG"]

          if event_name == "push":
              if not workflow_ref.startswith("refs/tags/"):
                  sys.exit("release workflow must run from a tag ref")
              tag = workflow_ref.removeprefix("refs/tags/")
          elif event_name == "workflow_dispatch":
              tag = dispatch_tag
          else:
              sys.exit("unsupported release workflow event")

          if TAG_RE.fullmatch(tag) is None:
              sys.exit("release tag must be written as vX.Y.Z")
          expected_ref = f"refs/tags/{tag}"
          if workflow_ref != expected_ref:
              if event_name == "workflow_dispatch":
                  sys.exit("workflow_dispatch must run at the selected tag ref")
              sys.exit("workflow ref must equal the selected release tag")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"version={tag.removeprefix('v')}\n")
              output.write(f"artifact_name=python-distributions-{tag}\n")
          PY
      - name: Check out selected tag
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ steps.validated-ref.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout is the selected tag commit
        env:
          TAG: ${{ steps.validated-ref.outputs.tag }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          test "$tag_commit" = "$head_commit"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Validate release metadata
        env:
          TAG: ${{ steps.validated-ref.outputs.tag }}
        run: python scripts/release_preflight.py --tag "$TAG"
      - name: Build and validate distributions
        env:
          TAG: ${{ steps.validated-ref.outputs.tag }}
        run: |
          rm -rf dist
          mkdir dist
          python -m build --outdir dist
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import sys
          import tarfile
          import zipfile

          version = os.environ["TAG"].removeprefix("v")
          dist = Path("dist")
          files = sorted(path for path in dist.iterdir() if path.is_file())
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              sys.exit("expected exactly one wheel and one sdist")

          def metadata_version(metadata: bytes) -> str | None:
              return email.message_from_bytes(metadata).get("Version")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1 or metadata_version(archive.read(names[0])) != version:
                  sys.exit("wheel metadata version does not match release tag")
          with tarfile.open(sdists[0]) as archive:
              members = [member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")]
              if len(members) != 1 or members[0].name.count("/") != 1:
                  sys.exit("source distribution metadata is invalid")
              metadata = archive.extractfile(members[0])
              if metadata is None or metadata_version(metadata.read()) != version:
                  sys.exit("source distribution metadata version does not match release tag")
          PY
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install and import the built wheel
        env:
          TAG: ${{ steps.validated-ref.outputs.tag }}
          WHEEL_CHECK: ${{ runner.temp }}/srvar-wheel-check
        run: |
          rm -rf "$WHEEL_CHECK"
          python -m venv "$WHEEL_CHECK"
          "$WHEEL_CHECK/bin/python" -m pip install --upgrade pip
          "$WHEEL_CHECK/bin/python" -m pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.1"
          "$WHEEL_CHECK/bin/python" -m pip install --no-deps dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$WHEEL_CHECK/bin/python" -c 'import os; import srvar; assert srvar.__version__ == os.environ["TAG"].removeprefix("v")'
          )
      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.validated-ref.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish validated distribution to PyPI
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == 'PUBLISH' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Prepare publication dist directory
        run: |
          rm -rf dist
          mkdir dist
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - name: Verify downloaded distributions
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import sys
          import tarfile
          import zipfile

          version = os.environ["TAG"].removeprefix("v")
          dist = Path("dist")
          files = sorted(path for path in dist.iterdir() if path.is_file()) if dist.is_dir() else []
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              sys.exit("expected exactly one downloaded wheel and one sdist")

          def metadata_version(metadata: bytes) -> str | None:
              return email.message_from_bytes(metadata).get("Version")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1 or metadata_version(archive.read(names[0])) != version:
                  sys.exit("downloaded wheel metadata version does not match release tag")
          with tarfile.open(sdists[0]) as archive:
              members = [member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")]
              if len(members) != 1 or members[0].name.count("/") != 1:
                  sys.exit("downloaded source distribution metadata is invalid")
              metadata = archive.extractfile(members[0])
              if metadata is None or metadata_version(metadata.read()) != version:
                  sys.exit("downloaded source distribution metadata version does not match release tag")
          PY
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: dist/
