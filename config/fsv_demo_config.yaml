# srvar-toolkit demo configuration (CSV input) for factor stochastic volatility (FSV)
#
# Run:
#   srvar validate config/fsv_demo_config.yaml
#   srvar run config/fsv_demo_config.yaml
#
# Notes:
# - FSV currently supports: volatility.dynamics = "rw", prior.family = "niw".
# - FSV supports ELB (shadow-rate data augmentation) and steady-state priors.
# - FSV supports robust shocks (Student-t / outlier mixture) via model.shocks.
#

data:
  csv_path: "examples/data/example.csv"
  date_column: "date"
  variables: ["r", "y"]
  dropna: true

model:
  p: 2
  include_intercept: true

  # Robust shock models (optional):
  #
  # shocks:
  #   enabled: true
  #   family: "student_t"
  #   df: 7.0

  volatility:
    enabled: true
    dynamics: "rw"
    covariance: "factor"

    # For N=2 variables, use k_factors=1.
    k_factors: 1

    # Prior variance for free elements of the loading matrix Lambda.
    loading_prior_var: 1.0

    # Store latent factor draws f_t (optional; can be memory intensive for large runs).
    store_factor_draws: false

    epsilon: 1.0e-4
    h0_prior_mean: 1.0e-6
    h0_prior_var: 10.0
    sigma_eta_prior_nu0: 1.0
    sigma_eta_prior_s0: 0.01

prior:
  family: "niw"
  method: "minnesota_legacy"
  minnesota:
    lambda1: 0.2
    lambda2: 0.5
    lambda3: 1.0
    lambda4: 100.0

sampler:
  draws: 1200
  burn_in: 300
  thin: 2
  seed: 42

forecast:
  enabled: true
  horizons: [1, 4, 8, 12]
  draws: 800
  quantile_levels: [0.1, 0.5, 0.9]

output:
  out_dir: "outputs/fsv_demo_run"
  save_fit: true
  save_forecast: true
  save_plots: true

plots:
  variables: ["r"]
  bands: [0.1, 0.9]
