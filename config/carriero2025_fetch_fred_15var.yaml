# Carriero et al. (2025) — 15-variable dataset (Table 1) via FRED fetch
#
# Paper:
#   Carriero, Clark, Marcellino, Mertens (2025), "Forecasting with Shadow-Rate VARs"
#
# Notes:
# - This config targets the 15-variable setup: 14 macro/financial variables + FEDFUNDS.
# - Transformations match Table 1:
#     - "∆ log(x) · 1200" is implemented as: tcode=5 (100*∆log) with scale=12.
#     - "log(x)" is implemented as: tcode=4.
#     - blank in Table 1 is taken as level: tcode=1.
# - For daily interest-rate series (e.g. FEDFUNDS), resampling to monthly uses `aggregation`.
#   FRED-MD vintages may use a different aggregation; adjust as needed.

fred:
  api_key_env: "FRED_API_KEY"
  start: "1959-03-01"
  end: "2022-08-31"

  series:
    EXUSUKx: { id: "EXUSUKx", tcode: 5, scale: 12 }
    SP500: { id: "SP500", tcode: 5, scale: 12 }
    HOUST: { id: "HOUST", tcode: 4 }
    PCEPI: { id: "PCEPI", tcode: 5, scale: 12 }
    PPICMM: { id: "PPICMM", tcode: 5, scale: 12 }
    WPSFD49207: { id: "WPSFD49207", tcode: 5, scale: 12 }
    CES0600000008: { id: "CES0600000008", tcode: 5, scale: 12 }
    CES0600000007: { id: "CES0600000007", tcode: 1 }
    PAYEMS: { id: "PAYEMS", tcode: 5, scale: 12 }
    UNRATE: { id: "UNRATE", tcode: 1 }
    CUMFNS: { id: "CUMFNS", tcode: 1 }
    INDPRO: { id: "INDPRO", tcode: 5, scale: 12 }
    DPCERA3M086SBEA: { id: "DPCERA3M086SBEA", tcode: 5, scale: 12 }
    RPI: { id: "RPI", tcode: 5, scale: 12 }

    FEDFUNDS: { id: "FEDFUNDS", tcode: 1 }

processing:
  frequency: "MS"
  transform_order: "resample_first"
  aggregation: "last"
  upsample: "ffill"
  dropna: true

output:
  csv_path: "data/cache/carriero2025_15var.csv"
  date_column: "date"

